name: Docker Image CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  
  workflow_dispatch:
      

jobs:

  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Docker Login
      uses: docker/login-action@v4.8.0
      with:
        registry: ghcr.io
        username: roseiestsage
        password: ${{secrets.GHCR_TOKEN}}
    - name: Build the Docker image
      run: |
        VERSION=$(date +%s)
        docker build ./backend -t ghcr.io/rosiestsag/quiz-backend:$VERSION
        docker build ./frontend -t ghcr.io/rosiestsage/quiz-frontend:$VERSION
        docker push ghcr.io/rosiestsag/quiz-backend:$VERSION
        docker push ghcr.io/rosiestsage/quiz-frontend:$VERSION
